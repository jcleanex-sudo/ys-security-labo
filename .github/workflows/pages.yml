name: Deploy KEIBA EDGE LAB to Pages

on:
  push:
    branches: [keiba-site]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: keiba-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test calculations
        run: npm test
      - name: Validate approved data only
        run: python scripts/validate_data.py
      - name: Run chronological safety evaluation
        run: python scripts/evaluate_weights.py
      - name: Build static artifact
        run: |
          mkdir _site
          cp -R index.html style.css app.js core.js data keirin _site/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
